<html>
<head>

  <script src="lib/blockly.min.js"></script>

  <script src="lib/workspace-backpack.js"></script>

<body>

<header class="ide-toolbar"> <!--The header section is a complete narrow row that holds the logo, navigation, and action buttons--> 
    
    <div class="logo"> <!--The container for the IDE logo -->
      <img src="assets/logo.png" alt="Company Logo" class="header-logo">  
    </div>

    <nav class="top-nav">
        <div class="segmented-control">
            <button id="btn-action" class="mode-btn active" onclick="setMode('action')">Create</button>
            <button id="btn-debug" class="mode-btn" onclick="setMode('debug')">Test</button>
        </div>       
    </nav>

  
    <div class="actions-center">

      <button id="mainRunBtn" class="action-btn run-style" onclick="toggleRunStop()" title="Run in RAM">
        <span id="run-icon">▶</span> <span id="run-text">Run</span>
      </button>

      <button id="flashBtn" class="action-btn flash-style" onclick="flashCode()" title="Save to ESP32">
         <span>⚡</span> Flash
      </button>
      <div id="debug-controls" class="hidden">
        <button id="step-btn">➔ Step</button>
    
        <label>
            <input type="checkbox" id="auto-step-check" checked> Auto-Step
        </label>

        <div class="speed-container">
            <input type="range" id="speed-slider" min="100" max="2000" value="500">
            <span id="speed-value">500ms</span>
        </div>
      </div>
      <button id="fullscreenBtn" class="btn">
        <span id="fs-icon">⛶</span> 
      </button>

    </div>

</header>

  
<div class="ide-container">

    <div id="simulation-container">
        <div class="panel-header">
            <span id="sim-panel-header">Simulator</span>
        </div>
        <div id="sim-canvas">

            <svg id="esp32-svg" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">

                <rect x="10" y="10" width="180" height="330" rx="10" fill="#2c2c2c" stroke="#444" stroke-width="2"/>
                
                <rect x="40" y="180" width="120" height="120" rx="4" fill="#c0c0c0" />
                <text x="100" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">ESP32-WROOM</text>
                
                <rect x="75" y="0" width="50" height="25" rx="3" fill="#333" />
                
                <rect x="30" y="30" width="25" height="25" rx="3" fill="#444" stroke="#666"/>
                <rect x="145" y="30" width="25" height="25" rx="3" fill="#444" stroke="#666"/>
                
                <circle id="led-power" cx="65" cy="42" r="4" fill="#400" />
                
                <circle id="led-d2" cx="135" cy="42" r="4" fill="#004" />

                <g id="pins">
                <rect x="15" y="70" width="15" height="250" fill="#1a1a1a" />
                    <rect x="170" y="70" width="15" height="250" fill="#1a1a1a" />
                    
                    <circle cx="22" cy="85" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="85" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="101" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="101" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                   
                    <circle cx="22" cy="117" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="117" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="133" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="133" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="149" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="149" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>
                    <circle cx="22" cy="165" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="165" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="181" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="181" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                   
                    <circle cx="22" cy="197" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="197" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="213" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="213" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="229" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="229" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>
                    <circle cx="22" cy="245" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="245" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="261" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="261" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                   
                    <circle cx="22" cy="277" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="277" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="293" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="293" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>                    
                    <circle cx="22" cy="309" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> <circle cx="178" cy="309" r="4" fill="#ffffff" stroke="#cd7f32" stroke-width="3"/> </g>
                    
                    

            </svg> 
        </div>
        <div id="sim-debug-bar" class="sim-debug-controls" style="display:none;">
            <button onclick="simStep()" title="Step Into">⏭️ Step</button>   
            <button onclick="stopSimDebug()" title="Stop">⏹️ Stop</button>
        </div>
        <div id="sim-toggle-tab" onclick="toggleSimPanel()">
            <span id="tab-icon">◂</span>
        </div>
    </div>

    <div id="sim-resizer" class="resizer-v"></div>

    <div class="main-layout">
              
        <div id="blocklyDiv"></div>
        <div id="console-resizer"></div>
        <div id="console-container" class="console-closed">
            <div id="terminalOutput"></div>
            <div class="console-input-row">
                <input type="text" id="console-input" placeholder="Type MicroPython command here...">
                <button id="send-console-btn" onclick="sendConsoleCommand()">🚀</button>
            </div>            
        </div>            
        <button id="python-edge-btn" onclick="toggleCodeOverlay()" title="Toggle Python Code">
        <img src="assets/brand-python.svg" width="35">        
        </button>

        <div id="code-overlay" class="overlay-hidden">

            <div class="overlay-header">

                <div class="header-left">
                <span>Python Code</span>
                </div>

                <div class="overlay-actions">                 
                    <button onclick="toggleCodeOverlay()">✕</button>
                </div>

            </div>

            <div id="overlay-editor-container">
                <textarea id="codeTextArea"></textarea>
            </div>
    
        </div> 

    </div>

        <div id="loadingOverlay" class="overlay-hidden">
        <div class="loader-container">
            <div class="spinner"></div>
            <p>Uploading to ESP32...</p>
        </div>
    </div>
</div> <!--End of ide-container-->
 
  

  <footer class="ide-footer">


    <div class="footer-left">
        <div id="connection-led" class="led-off"></div>
        <span id="footer-status">ESP32 not connected</span>
    </div>

    <div class="footer-center">
        <div class="connectivity-hub">
            <button id="connectBtn1" class="footer-connect-btn" onclick="connectESP32()">
                <span class="conn-icon">🔌</span> USB Connect
            </button>
            
            <button class="footer-conn-type disabled" title="WiFi (Coming Soon)">📶</button>
            <button class="footer-conn-type disabled" title="Bluetooth (Coming Soon)">ᛒ</button>
        </div>
    </div>

    <div class="footer-right">
        <span class="footer-info">ESP32 | MicroPython</span>
        <button class="terminal-toggle-btn" onclick="toggleTerminal()">Console ⌃</button>
    
    </div>
    
</footer>

  <div id="ide-dialog-overlay" class="dialog-hidden">
    <div class="ide-dialog">
        <div class="dialog-header">
            <span id="dialog-title">System Message</span>
            <button onclick="closeDialog()" class="dialog-close-x">✕</button>
        </div>
        <div class="dialog-body">
            <p id="dialog-message">Please connect your ESP32 before uploading.</p>
        </div>
        <div class="dialog-footer">
            <button onclick="closeDialog()" class="primary-btn">Got it</button>
        </div>
    </div>
  </div>

<div id="edusharks-toast-container"></div>

<div id="shark-dialog-overlay" class="dialog-overlay dialog-hidden">
        <div class="dialog-box">
            <h2 id="shark-dialog-title"></h2>
            <div id="shark-dialog-custom-content"></div>
            <div style="margin-top:20px; text-align:right;">
                <button class="secondary-btn" onclick="closeSharkDialog()">Cancel</button>
                <button id="shark-dialog-confirm-btn" class="primary-btn">Confirm</button>
            </div>
        </div>
</div>
  
  <script src="blocks.js"></script>
  <script src="blocks_extensions.js"></script>  
  <script src="generators.js"></script>
  <script src="toolbox.js"></script> 
  <script src="node_modules\@blockly\toolbox-search\dist\index.js"></script>
  <script src="app.js"></script>


</body>
</html>
