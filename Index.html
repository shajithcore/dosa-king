<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Blockly IDE</title>

  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/python_compressed.js"></script>
  <script src="https://unpkg.com/@blockly/disable-top-blocks"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/codemirror.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/theme/material.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/mode/python/python.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
  <header class="ide-toolbar">
    <div class="logo">
      <img src="assets/logo.png" alt="Company Logo" class="header-logo">
    </div>
    
    <div class="actions-center">

      <button id="connectBtn" class="btn btn-connect" onclick="connectESP32()">
        Connect ESP32
      </button>

      <button id="uploadBtn" class="btn btn-upload" onclick="uploadCode()" disabled>
        Upload to ESP32
      </button>

      <button id="stopBtn" class="btn btn-stop" onclick="stopESP32()" disabled>
        Stop
      </button>

      <button id="fullscreenBtn" class="btn">
        <span id="fs-icon">⛶</span> Fullscreen
      </button>

      <button class="btn btn-sim" onclick="toggleSimulation()">
        Run Simulation
      </button>

    </div>

    <div class="actions-right">
      <button class="btn btn-download" onclick="downloadCode()">
        Download .py
      </button>
    </div>
  </header>

  <main class="ide-container">

    <div id="blocklyDiv"></div>
    <div id="rightPanel">
          <div id="editorContainer">
              <textarea id="codeTextArea"></textarea>
          </div>

          <div id="terminalContainer">
              <div class="terminal-header">
                  <span>Terminal Output</span>                  
                  <div class="header-controls">
                      <button id="clearTerminalBtn">🗑️</button>
                      <span id="expandIcon">▲</span>
                  </div>
              </div>
                <div id="terminalOutput"></div>
          </div>
    </div>
              
  </main>

  <div id="loadingOverlay" class="overlay-hidden">
    <div class="loader-container">
        <div class="spinner"></div>
        <p>Uploading to ESP32...</p>
    </div>
  </div>
  
  <script src="blocks.js"></script>
  <script src="generators.js"></script>
  <script src="toolbox.js"></script> 
  <script src="app.js"></script>

</body>
</html>
