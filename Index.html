<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Blockly IDE</title>

  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/python_compressed.js"></script>
  <script src="https://unpkg.com/@blockly/disable-top-blocks"></script>
  <script src="https://unpkg.com/@blockly/workspace-backpack"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/codemirror.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/lib/codemirror.min.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/monokai.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/material-palenight.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/cobalt.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/mode/python/python.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=JetBrains+Mono:wght@300;500&family=IBM+Plex+Mono:wght@300;500&family=Space+Mono&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>


  <header class="ide-toolbar"> <!--The header section is a complete narrow row that holds the logo, navigation, and action buttons--> 
    
    <div class="logo"> <!--The container for the IDE logo -->
      <img src="assets/logo.png" alt="Company Logo" class="header-logo">  
    </div>


    <nav class="top-nav"> <!--The navigation section that contains the view toggle switches and other navigation buttons-->
            
        <div class="mode-toggle-container"> <!--The container for the view toggle switches-->
            <span class="toggle-label">Build</span> <!--The label for the block view toggle-->
            <label class="switch"> <!--The switch for toggling between block and code views-->
                <input type="checkbox" id="toggleCode" onchange="toggleEditorView()"> <!--The checkbox input for the code view toggle-->
                <span class="slider round"></span> <!--The slider for the switch-->
            </label>
            <span class="toggle-label">Test</span> <!--The label for the code view toggle-->
        </div>      

    </nav>

    
    <div class="actions-center">

      <button id="connectBtn" class="btn btn-connect" onclick="connectESP32()">Connect ESP32</button>

      <button id="uploadBtn" class="btn btn-upload" onclick="uploadCode()" disabled>Upload to ESP32</button>

      <button id="stopBtn" class="btn btn-stop" onclick="stopESP32()" disabled>Stop</button>

      <button id="fullscreenBtn" class="btn">
        <span id="fs-icon">⛶</span> 
      </button>

    </div>

    
    <div class="actions-right">

        <div class="nav-buttons">
            <button class="icon-btn code-toggle-btn" onclick="toggleCodeOverlay()">
                <div class="python-icon-wrapper">
                    <img src="assets/brand-python.svg" alt="Python Icon" class="python-icon">
                </div>
                <span class="btn-text">Python</span>
            </button>

        </div>

    </div>

  </header>

  
  <div class="ide-container">

    <div id="simulation-container">


        <div id="sim-canvas">
            <svg id="esp32-svg" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="10" width="180" height="330" rx="10" fill="#2c2c2c" stroke="#444" stroke-width="2"/>
                
                <rect x="40" y="180" width="120" height="120" rx="4" fill="#c0c0c0" />
                <text x="100" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">ESP32-WROOM</text>
                
                <rect x="75" y="0" width="50" height="25" rx="3" fill="#333" />
                
                <rect x="30" y="30" width="25" height="25" rx="3" fill="#444" stroke="#666"/>
                <rect x="145" y="30" width="25" height="25" rx="3" fill="#444" stroke="#666"/>
                
                <circle id="led-power" cx="65" cy="42" r="4" fill="#400" />
                
                <circle id="led-d2" cx="135" cy="42" r="4" fill="#004" />

                <g id="pins">
                    <rect x="15" y="70" width="15" height="250" fill="#1a1a1a" />
                    <rect x="170" y="70" width="15" height="250" fill="#1a1a1a" />
                    
                    <circle cx="22" cy="85" r="4" fill="#cd7f32" /> <circle cx="178" cy="85" r="4" fill="#cd7f32" /> </g>
                </svg>
        </div>

        <div id="sim-toggle-tab" onclick="toggleSimPanel()">
            <span id="tab-icon">◂</span>
        </div>
    </div>

    <div id="sim-resizer" class="resizer-v"></div>

    <div class="main-layout">  <!--The main content area that holds the Blockly workspace and the code editor-->

        <div id="blocklyDiv"></div>  
              
        <div id="resizer-v" class="resizer-v hidden"></div>
        
        <div id="editor-container" class="editor-hidden"></div>

            <div id="code-overlay" class="overlay-hidden"> <!--The overlay container for the code editor, initially hidden-->

                <div class="overlay-header"> <!--The header section of the code overlay that contains the title, theme selector, transparency slider, and action buttons-->

                    <div class="header-left"> <!--The left side of the header that contains the title, theme selector, and transparency slider-->

                        <span class="header-title">Python Reference</span> <!--The title of the code overlay-->
                        
                        <select id="themeSelect" class="glass-select" onchange="changeEditorTheme()"> <!--The dropdown for selecting the code editor theme-->
                            <option value="dracula">Cyberpunk (Dracula)</option>
                            <option value="monokai">Classic (Monokai)</option>
                            <option value="material-palenight">Modern (Material)</option>
                            <option value="cobalt">Deep Blue (Cobalt)</option>
                        </select>

                        <div class="slider-container" title="Adjust Transparency"> <!--The container for the transparency slider with a tooltip-->
                            <span style="font-size: 10px; color: #aaa;">🫥</span>
                            <input type="range" id="opacitySlider" class="transparency-slider" 
                                min="0.05" max="0.9" step="0.05" value="0.15" 
                                oninput="updateTransparency()">
                            <span style="font-size: 10px; color: #aaa;">⬛</span>
                        </div>

                    </div>   <!-- end of header-left -->

                    <div class="overlay-actions"> <!--The right side of the header that contains the action buttons-->
                        <button class="header-btn" onclick="downloadCode()" title="Download .py">💾</button>
                        <button class="header-btn" onclick="toggleCodeOverlay()">✕</button>
                    </div>

                    <div id="loadingOverlay" class="overlay-hidden"> <!--The overlay that appears during code upload, initially hidden-->
                        <div class="loader-container">
                            <div class="spinner"></div>  <!-- The spinner element for the loading animation -->
                                <p>Uploading to ESP32...</p>
                        </div>
                    </div>   


                </div>   <!-- end of overlay-header -->

                <div id="overlay-editor-container"> <!--The container for the code editor within the overlay-->
                    <textarea id="codeTextArea"></textarea> <!--The textarea that will be transformed into a CodeMirror editor-->
                </div>

            </div> <!-- end of code-overlay -->
    
     
                    
    </div>  <!--End of main-layout-->
            

  <script src="blocks.js"></script>
  <script src="generators.js"></script>
  <script src="toolbox.js"></script> 
  <script src="app.js"></script>

</body>
</html>
